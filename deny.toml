# cargo-deny config. CI runs `cargo deny check advisories` only (RustSec gate).
# Dependabot misses most RustSec advisories for this repo, so this is the
# check that catches them.
[graph]
all-features = true

[advisories]
# Defaults are "workspace" in cargo-deny 0.20; check the whole graph.
unmaintained = "all"
unsound = "all"
# Fail on vulnerabilities, unsound and unmaintained crates in the whole graph.
# Add an entry here only with a reason and a link.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained but has no known vulnerability; migration to jiff or time is tracked separately. https://rustsec.org/advisories/RUSTSEC-2026-0543" },
]
