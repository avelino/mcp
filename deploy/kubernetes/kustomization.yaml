apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # Create the Secret separately before applying (see secret.yaml for template):
  #   kubectl -n mcp create secret generic mcp-secrets --from-literal=sentry-token=sntrys_...
  # Durable /data. REQUIRED if serverAuth.providers includes "oauth_as"
  # (losing the AS state logs every user out on each restart); optional
  # for audit logs. See pvc.yaml.
  # - pvc.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: mcp
