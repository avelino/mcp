name: Release Beta

on:
  # CI completes on push to main and on pull_request, including from forks.
  # `branches` compares the triggering run's head branch name, so a fork PR
  # opened from a branch named main matches it. workflow_run then runs here,
  # in this repository, with this repository's token. The job `if` is the
  # gate that rejects that run. zizmor flags the trigger itself.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    # Same-repo push to main whose CI succeeded. A fork fails the repository
    # check even when its branch is named main; a pull_request fails the
    # event check. Evaluated before the matrix, so a rejected run checks
    # nothing out and uploads nothing.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # musl targets are what the Docker images run: a glibc binary needs
          # a dynamic loader that scratch does not have, and alpine (the full
          # image) has musl, not glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-large
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 commit shared with the other workflows
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build with cross
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/mcp mcp-${{ matrix.target }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/mcp.exe mcp-${{ matrix.target }}.exe

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-${{ matrix.target }}
          path: mcp-${{ matrix.target }}

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-${{ matrix.target }}
          path: mcp-${{ matrix.target }}.exe

  publish:
    needs: build
    # A job-level `if` replaces the implicit success() check. Keep the build
    # result in the condition so a skipped or failed matrix does not publish,
    # and repeat the trust check on the job that holds contents: write.
    if: >-
      needs.build.result == 'success'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete and create the beta prerelease, including its tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Prepare release
        id: prep
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHA=$(echo "$HEAD_SHA" | cut -c1-7)
          TAG="v${VERSION}-beta+${SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Delete previous beta releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName' | while read -r tag; do
            if echo "$tag" | grep -q "beta"; then
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      - name: Create beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.prep.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Collect all binaries
          FILES=()
          for dir in artifacts/mcp-*/; do
            for file in "$dir"*; do
              [ -f "$file" ] && FILES+=("$file")
            done
          done

          gh release create "$RELEASE_TAG" \
            --prerelease \
            --title "Beta $RELEASE_TAG" \
            --notes "Automated beta build from main branch (commit $HEAD_SHA)" \
            "${FILES[@]}"

  docker:
    needs: build
    # Same replacement of success() as publish. This job is the one that
    # pushes to GHCR, so it carries the same trust check on its own.
    if: >-
      needs.build.result == 'success'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push ghcr.io/avelino/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare version
        id: prep
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHA=$(echo "$HEAD_SHA" | cut -c1-7)
          echo "tag=${VERSION}-beta.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker contexts
        run: |
          mkdir -p docker-amd64 docker-arm64
          # musl, not gnu: these binaries are statically linked, so they run
          # both on scratch (no loader at all) and on alpine (musl libc).
          cp artifacts/mcp-x86_64-unknown-linux-musl/mcp-x86_64-unknown-linux-musl docker-amd64/mcp
          cp artifacts/mcp-aarch64-unknown-linux-musl/mcp-aarch64-unknown-linux-musl docker-arm64/mcp
          chmod +x docker-amd64/mcp docker-arm64/mcp
          cp Dockerfile docker-amd64/
          cp Dockerfile docker-arm64/

      - name: Verify the binaries are static
        run: |
          for f in docker-amd64/mcp docker-arm64/mcp; do
            if file "$f" | grep -q "dynamically linked"; then
              echo "::error::$f is dynamically linked and will not run on scratch"
              file "$f"
              exit 1
            fi
            echo "ok: $(file -b "$f")"
          done

      - name: Build and push (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-amd64
          target: release
          platforms: linux/amd64
          push: true
          tags: ghcr.io/avelino/mcp:${{ steps.prep.outputs.tag }}-amd64
          provenance: false

      - name: Build and push (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-arm64
          target: release
          platforms: linux/arm64
          push: true
          tags: ghcr.io/avelino/mcp:${{ steps.prep.outputs.tag }}-arm64
          provenance: false

      - name: Build and push full (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-amd64
          target: full
          platforms: linux/amd64
          push: true
          tags: ghcr.io/avelino/mcp:${{ steps.prep.outputs.tag }}-full-amd64
          provenance: false

      - name: Build and push full (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-arm64
          target: full
          platforms: linux/arm64
          push: true
          tags: ghcr.io/avelino/mcp:${{ steps.prep.outputs.tag }}-full-arm64
          provenance: false

      - name: Create multi-arch manifests
        env:
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/avelino/mcp:beta \
            -t "ghcr.io/avelino/mcp:${TAG}" \
            "ghcr.io/avelino/mcp:${TAG}-amd64" \
            "ghcr.io/avelino/mcp:${TAG}-arm64"
          docker buildx imagetools create \
            -t ghcr.io/avelino/mcp:beta-full \
            -t "ghcr.io/avelino/mcp:${TAG}-full" \
            "ghcr.io/avelino/mcp:${TAG}-full-amd64" \
            "ghcr.io/avelino/mcp:${TAG}-full-arm64"

      - name: Smoke test the published images
        env:
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          for tag in "${TAG}" "${TAG}-full"; do
            echo "--- ghcr.io/avelino/mcp:${tag}"
            docker run --rm "ghcr.io/avelino/mcp:${tag}" --version
          done
          docker run --rm --entrypoint sh "ghcr.io/avelino/mcp:${TAG}-full" -c \
            'for c in npx uvx docker kubectl gh; do command -v "$c" >/dev/null || { echo "missing: $c"; exit 1; }; echo "ok: $c"; done'
