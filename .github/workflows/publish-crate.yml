name: Publish Crate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-crate-${{ github.ref }}
  # Nunca cancela: `cargo publish` na crates.io e irreversivel, nao existe
  # unpublish. O group so impede run paralela do mesmo tag.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: publish
          save-if: false

      - name: Verify build
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Dry-run publish
        run: cargo publish --dry-run

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish || echo "::warning::Crate version already published, skipping"
