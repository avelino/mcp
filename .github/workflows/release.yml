name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    if: "!contains(github.ref_name, 'beta')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test
          save-if: false

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # musl targets are what the Docker images run: a glibc binary needs
          # a dynamic loader that scratch does not have, and alpine (the full
          # image) has musl, not glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-large
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build with cross
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/mcp mcp-${{ matrix.target }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/mcp.exe mcp-${{ matrix.target }}.exe

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-${{ matrix.target }}
          path: mcp-${{ matrix.target }}

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-${{ matrix.target }}
          path: mcp-${{ matrix.target }}.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Collect all binaries
          FILES=()
          for dir in artifacts/mcp-*/; do
            for file in "$dir"*; do
              [ -f "$file" ] && FILES+=("$file")
            done
          done

          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            "${FILES[@]}"

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker contexts
        run: |
          mkdir -p docker-amd64 docker-arm64
          # musl, not gnu: these binaries are statically linked, so they run
          # both on scratch (no loader at all) and on alpine (musl libc).
          cp artifacts/mcp-x86_64-unknown-linux-musl/mcp-x86_64-unknown-linux-musl docker-amd64/mcp
          cp artifacts/mcp-aarch64-unknown-linux-musl/mcp-aarch64-unknown-linux-musl docker-arm64/mcp
          chmod +x docker-amd64/mcp docker-arm64/mcp
          cp Dockerfile docker-amd64/
          cp Dockerfile docker-arm64/

      - name: Verify the binaries are static
        run: |
          for f in docker-amd64/mcp docker-arm64/mcp; do
            if file "$f" | grep -q "dynamically linked"; then
              echo "::error::$f is dynamically linked and will not run on scratch"
              file "$f"
              exit 1
            fi
            echo "ok: $(file -b "$f")"
          done

      - name: Build and push (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-amd64
          target: release
          platforms: linux/amd64
          push: true
          tags: ghcr.io/avelino/mcp:${{ steps.meta.outputs.version }}-amd64
          provenance: false

      - name: Build and push (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-arm64
          target: release
          platforms: linux/arm64
          push: true
          tags: ghcr.io/avelino/mcp:${{ steps.meta.outputs.version }}-arm64
          provenance: false

      - name: Build and push full (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-amd64
          target: full
          platforms: linux/amd64
          push: true
          tags: ghcr.io/avelino/mcp:${{ steps.meta.outputs.version }}-full-amd64
          provenance: false

      - name: Build and push full (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-arm64
          target: full
          platforms: linux/arm64
          push: true
          tags: ghcr.io/avelino/mcp:${{ steps.meta.outputs.version }}-full-arm64
          provenance: false

      - name: Create multi-arch manifests
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          docker buildx imagetools create \
            -t ghcr.io/avelino/mcp:latest \
            -t ghcr.io/avelino/mcp:${VERSION} \
            ghcr.io/avelino/mcp:${VERSION}-amd64 \
            ghcr.io/avelino/mcp:${VERSION}-arm64
          docker buildx imagetools create \
            -t ghcr.io/avelino/mcp:full \
            -t ghcr.io/avelino/mcp:${VERSION}-full \
            ghcr.io/avelino/mcp:${VERSION}-full-amd64 \
            ghcr.io/avelino/mcp:${VERSION}-full-arm64

      - name: Smoke test the published images
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          for tag in "${VERSION}" "${VERSION}-full"; do
            echo "--- ghcr.io/avelino/mcp:${tag}"
            docker run --rm "ghcr.io/avelino/mcp:${tag}" --version
          done
          # The full image exists for backends with a `command`; if a runtime
          # went missing the image is pointless, so fail the release here.
          docker run --rm --entrypoint sh "ghcr.io/avelino/mcp:${VERSION}-full" -c \
            'for c in npx uvx docker kubectl gh; do command -v "$c" >/dev/null || { echo "missing: $c"; exit 1; }; echo "ok: $c"; done'
