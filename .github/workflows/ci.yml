name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Building is not enough: the images shipped before this were built fine
      # and could not exec at all. Load each one and run it.
      - name: Build Docker image (scratch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (full)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: full-source
          push: false
          load: true
          tags: mcp:ci-full
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test both images
        run: |
          docker run --rm mcp:ci --version
          docker run --rm mcp:ci-full --version
          docker run --rm --entrypoint sh mcp:ci-full -c \
            'for c in npx uvx docker kubectl gh; do command -v "$c" >/dev/null || { echo "missing: $c"; exit 1; }; echo "ok: $c"; done'

      - name: Config mount resolves to the documented path
        run: |
          mkdir -p cfg
          echo '{"mcpServers":{"probe":{"url":"https://example.com/mcp"}}}' > cfg/servers.json
          out=$(docker run --rm -v "$PWD/cfg:/root/.config/mcp" mcp:ci --list 2>/dev/null)
          echo "$out"
          echo "$out" | grep -q '"probe"' || {
            echo "::error::-v ~/.config/mcp:/root/.config/mcp is not the path the binary reads"
            exit 1
          }
