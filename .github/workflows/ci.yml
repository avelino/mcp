name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Building is not enough: the images shipped before this were built fine
      # and could not exec at all. Load each one and run it.
      - name: Build Docker image (scratch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (full)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full-source
          push: false
          load: true
          tags: mcp:ci-full
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test both images
        run: |
          docker run --rm mcp:ci --version
          docker run --rm mcp:ci-full --version
          docker run --rm --entrypoint sh mcp:ci-full -c \
            'for c in npx uvx docker kubectl gh; do command -v "$c" >/dev/null || { echo "missing: $c"; exit 1; }; echo "ok: $c"; done'

      - name: Config mount resolves to the documented path
        run: |
          mkdir -p cfg
          echo '{"mcpServers":{"probe":{"url":"https://example.com/mcp"}}}' > cfg/servers.json
          out=$(docker run --rm -v "$PWD/cfg:/root/.config/mcp" mcp:ci --list 2>/dev/null)
          echo "$out"
          echo "$out" | grep -q '"probe"' || {
            echo "::error::-v ~/.config/mcp:/root/.config/mcp is not the path the binary reads"
            exit 1
          }
